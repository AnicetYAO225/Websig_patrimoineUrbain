server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour une SPA React Router : toute route inconnue de Nginx
    # (ex: /dashboard, /admin) doit quand même renvoyer index.html, pour que
    # React Router prenne le relais côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
